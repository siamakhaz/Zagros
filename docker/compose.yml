# Docker Compose — Zagros + HelixDB + MCP HTTP server + UI
#
# Services
# --------
#   helix     — HelixDB graph-vector store
#   mcp       — zagros-mcp-http — persistent Streamable HTTP MCP server
#   zagros-ui — zagros-ui web UI (axum, port 8788)
#
# The stdio zagros-mcp binary is still launched on-demand by Docker Desktop's
# MCP Toolkit as a short-lived subprocess; do NOT add it here.
#
# Networking
# ----------
# HelixDB is bound to 127.0.0.1 only (fixes security finding F-01).
# Host CLI tools still reach it at http://localhost:47474.
# The mcp and zagros-ui containers reach it via the internal zagros Docker
# network at http://helix:8080.
#
# Optional reverse proxy (e.g. Traefik on the external proxy network) routes:
#   mcp.example.com    -> mcp:8789
#   zagros.example.com -> zagros-ui:8788
# Both containers must be attached to proxy_default for the proxy to reach them.
# Substitute your own domains and network name.
#
# Usage
# -----
#   docker compose -f docker/compose.yml up -d              # start all services
#   docker compose -f docker/compose.yml up -d helix        # start HelixDB only
#   docker compose -f docker/compose.yml down               # stop (data kept)
#   docker compose -f docker/compose.yml down -v            # stop + delete data
#
# Environment variables
#   ZAGROS_DATA_DIR      Host path for HelixDB data  (default: ./data)
#   MCP_BIND_ADDR         Bind address for the HTTP MCP server (default: 0.0.0.0:8789)
#   MCP_ALLOWED_HOSTS     Comma-separated Host header allowlist
#                         (default: "localhost,127.0.0.1")
#                         Add your host IP, e.g. "10.0.0.5:8789,localhost"

name: zagros

services:

  helix:
    # Pin: helixdb:latest as of 2026-08-16
    image: ghcr.io/helixdb/helixdb@sha256:ba41464c42b3cd58edd0f049e15bd7bea673f6abd217eb0ea5f5160b46a4412f
    container_name: zagros-helix
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ports:
      # Bind to 127.0.0.1 only — fixes security finding F-01.
      # Host CLI tools use http://localhost:47474 as before.
      # Containers reach HelixDB via the internal network (http://helix:8080).
      - "127.0.0.1:47474:8080"
    volumes:
      - type: bind
        source: ${ZAGROS_DATA_DIR:-./data}
        target: /data
    networks:
      - zagros
    healthcheck:
      disable: true

  mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zagros-mcp:0.1.0
    container_name: zagros-mcp-http
    restart: unless-stopped
    depends_on:
      helix:
        condition: service_started
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    environment:
      HELIX_URL: http://helix:8080
      MCP_BIND_ADDR: ${MCP_BIND_ADDR:-0.0.0.0:8789}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      ZAGROS_AUTO_REFRESH: ${ZAGROS_AUTO_REFRESH:-true}
      ZAGROS_REFRESH_CRON: "${ZAGROS_REFRESH_CRON:-0 3 * * *}"
      ZAGROS_DAILY_CVE_LIMIT: ${ZAGROS_DAILY_CVE_LIMIT:-1000}
    ports:
      - "${MCP_HOST_BIND:-127.0.0.1}:8789:8789"
    volumes:
      - zagros-data:/data
    networks:
      - zagros
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8789/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  zagros-ui:
    build:
      context: ..
      dockerfile: Dockerfile.ui
    container_name: zagros-ui
    restart: unless-stopped
    depends_on:
      helix:
        condition: service_started
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 128
    environment:
      HELIX_URL: http://helix:8080
      UI_PORT: 8788
    ports:
      - "${UI_HOST_BIND:-127.0.0.1}:8788:8788"
    networks:
      - zagros
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8788/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cli:
    build:
      context: ..
      dockerfile: Dockerfile.cli
    image: zagros-cli:0.1.0
    profiles: ["cli"]
    networks:
      - zagros
    environment:
      HELIX_URL: http://helix:8080
    volumes:
      - zagros-data:/data
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    restart: "no"

volumes:
  zagros-data:

networks:
  zagros:
    name: zagros
    driver: bridge
