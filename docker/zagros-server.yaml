name: zagros
title: Security RAG (CVE + CWE + ASVS + CAPEC + ATT&CK)
type: server
image: zagros-mcp:0.1.0
# The image default entrypoint is zagros-mcp-http (HTTP server).
# The MCP Toolkit needs the stdio binary, so override it here.
command: ["/usr/local/bin/zagros-mcp"]
description: >
  Search CVE records and the security knowledge base (MITRE CWE, OWASP ASVS,
  MITRE CAPEC, MITRE ATT&CK) stored in a local HelixDB instance.
  Tools: search_cves, get_cve, index_status, sync_cves.
allowHosts:
  - raw.githubusercontent.com:443
  - host.docker.internal:47474
env:
  - name: HELIX_URL
    value: http://host.docker.internal:47474
