name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$cargo_version" = "$tag"
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
  binaries:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: zagros-linux-x86_64
            ext: ""
          - os: windows-latest
            artifact: zagros-windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo build --release --locked --bins
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          for bin in zagros zagros-mcp zagros-mcp-http zagros-ui; do
            cp "target/release/${bin}${{ matrix.ext }}" "dist/${bin}${{ matrix.ext }}"
          done
      - name: Create archive and checksums
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip"
            sha256sum "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          else
            tar -C dist -czf "${{ matrix.artifact }}.tar.gz" .
            sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
  skill:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Build deterministic skill package
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" python skills/build-dist.py
          cp skills/install.sh skills/dist/
          cp skills/install.ps1 skills/dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zagros-skill
          path: skills/dist/*

  containers:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: mcp
            dockerfile: Dockerfile
          - name: cli
            dockerfile: Dockerfile.cli
          - name: ui
            dockerfile: Dockerfile.ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zagros-${{ matrix.name }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository_owner }}/zagros-${{ matrix.name }}:${{ needs.validate.outputs.version }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/zagros-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Save image digest
        run: |
          mkdir -p digest
          echo "ghcr.io/${{ github.repository_owner }}/zagros-${{ matrix.name }}@${{ steps.build.outputs.digest }}" > "digest/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-digest-${{ matrix.name }}
          path: digest/*.txt
  publish:
    needs: [validate, binaries, skill, containers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate release SPDX SBOM
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src:ro" anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 dir:/src --exclude './target/**' --exclude './website/node_modules/**' --exclude './website/dist/**' -o spdx-json > release-artifacts/zagros-source.spdx.json
      - name: Build combined checksum file
        shell: bash
        run: |
          find release-artifacts -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > release-artifacts/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/zagros-skill.tar.gz
            release-artifacts/zagros-source.spdx.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --generate-notes \
            --title "Zagros ${RELEASE_TAG}" \
            release-artifacts/*






