name: Live source compatibility

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build source/provenance tests
        run: cargo test --lib provenance::tests -- --nocapture
      - name: Validate configured source URLs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI https://cwe.mitre.org/data/xml/cwec_latest.xml.zip >/dev/null
          curl -fsSI https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.csv >/dev/null
          curl -fsSI https://capec.mitre.org/data/xml/capec_latest.xml >/dev/null
          curl -fsSI https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json >/dev/null
          curl -fsSI https://raw.githubusercontent.com/CVEProject/cvelistV5/main/cves/delta.json >/dev/null
